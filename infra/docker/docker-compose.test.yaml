# Isolated MySQL stack without published ports or persistent database data.
name: payroll-api-test
services:
  redis:
    extends:
      file: docker-compose.yaml
      service: redis
    volumes: !reset []
    tmpfs:
      - /data
    restart: "no"
  vector-db:
    extends:
      file: docker-compose.yaml
      service: vector-db
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"
  db:
    extends:
      file: docker-compose.yaml
      service: db
    volumes: !reset []
    tmpfs:
      - /var/lib/mysql
    restart: "no"
  backend:
    extends:
      file: docker-compose.yaml
      service: backend
    ports: !reset []
    volumes: !reset []
    tmpfs:
      - /models
    restart: "no"
  ui:
    extends:
      file: docker-compose.yaml
      service: ui
    ports: !reset []
    restart: "no"
