services:
  backend:
    container_name: payroll-agent-backend
    image: ghcr.io/tri-hackathon-inc/payroll-agent-backend:${IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/agents/')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ui:
    container_name: payroll-agent-ui
    image: ghcr.io/tri-hackathon-inc/payroll-agent-ui:${IMAGE_TAG:-latest}
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
