# The explicit local command uses the same stack as the default (plus the temporary TriNet mock).
name: payroll-local
services:
  db:
    extends:
      file: docker-compose.yaml
      service: db
  backend:
    extends:
      file: docker-compose.yaml
      service: backend
  ui:
    extends:
      file: docker-compose.yaml
      service: ui
  trinet-mock:
    extends:
      file: docker-compose.yaml
      service: trinet-mock
  trinet-ui:
    extends:
      file: docker-compose.yaml
      service: trinet-ui
volumes:
  mysql_data:
  trinet_data:
