# The explicit local command uses the same three-service stack as the default.
name: payroll-local
services:
  db:
    extends:
      file: docker-compose.yaml
      service: db
  backend:
    extends:
      file: docker-compose.yaml
      service: backend
  ui:
    extends:
      file: docker-compose.yaml
      service: ui
volumes:
  mysql_data:
