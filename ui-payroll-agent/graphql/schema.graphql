scalar JSON

  type ModelConfig {
    id: ID!
    name: String!
    provider: String!
    modelId: String!
    enabled: Boolean!
    endpointEnv: String!
    credentialEnv: String!
    parameters: JSON!
  }

  type Service {
    id: ID!
    name: String!
    domain: String!
    enabled: Boolean!
    baseUrlEnv: String!
    method: String!
    path: String!
  }

  type Template {
    id: ID!
    name: String!
    description: String!
    version: Int!
    config: JSON!
    modelConfig: ModelConfig!
    service: Service!
    attachedServices: [Service!]!
    modelOptions: [ModelConfig!]!
    serviceOptions: [Service!]!
  }

  type Business { name: String!, label: String!, domain: String! }
  type Agent {
    id: ID!
    name: String!
    businessName: String!
    templateId: String!
    templateVersion: Int!
    config: JSON!
    createdAt: String!
    updatedAt: String!
  }
  input CreateAgentInput {
    businessName: String!
    templateId: String!
    name: String!
    config: JSON!
  }
  input UpdateAgentInput {
    id: ID!
    businessName: String!
    name: String!
    config: JSON!
  }
  type Mutation {
    createAgent(input: CreateAgentInput!): Agent!
    updateAgent(input: UpdateAgentInput!): Agent!
  }
  type Query {
    getTemplates: [Template!]!
    getTemplate(id: ID!): Template!
    getBusinesses: [Business!]!
    getBusinessAgents(businessName: String!): [Agent!]!
  }
