# Development override: builds from local source and bind-mounts it for hot reload.
#
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up --build
#
# Local builds are tagged :dev so they never overwrite the pulled :latest images.
services:
  backend:
    image: payroll-agent-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app

  ui:
    image: payroll-agent-ui:dev
    build:
      context: ./ui-payroll-agent
      dockerfile: Dockerfile
    volumes:
      - ./ui-payroll-agent:/app
      - ui_node_modules:/app/node_modules

volumes:
  ui_node_modules:
