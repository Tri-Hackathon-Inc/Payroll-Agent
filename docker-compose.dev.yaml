# docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up --build
services:
  backend:
    volumes:
      - ./backend/registry:/app/registry:ro
      - ./backend/templates:/app/templates:ro
      - ./backend/local_server:/app/local_server:ro
      - ./backend/graphql/aistudio.js:/app/graphql/aistudio.js:ro
      - ./backend/graphql/client.js:/app/graphql/client.js:ro
      - ./backend/graphql/webhook.js:/app/graphql/webhook.js:ro
      - ./backend/graphql/modelRuntime.js:/app/graphql/modelRuntime.js:ro
      - ./backend/graphql/payrunContext.js:/app/graphql/payrunContext.js:ro
      - ./backend/graphql/agentPrompt.js:/app/graphql/agentPrompt.js:ro
      - ./backend/graphql/incidentReport.js:/app/graphql/incidentReport.js:ro
  ui:
    volumes:
      - ./ui-payroll-agent/src:/app/src:ro
      - ./ui-payroll-agent/mock:/app/mock:ro
      - ./ui-payroll-agent/graphql:/app/graphql:ro
