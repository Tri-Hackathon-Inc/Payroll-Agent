# Isolated MySQL stack without published ports or persistent database data.
name: payroll-api-test
services:
  db:
    extends:
      file: docker-compose.yaml
      service: db
    volumes: !reset []
    tmpfs:
      - /var/lib/mysql
    restart: "no"
  backend:
    extends:
      file: docker-compose.yaml
      service: backend
    ports: !reset []
    restart: "no"
  ui:
    extends:
      file: docker-compose.yaml
      service: ui
    ports: !reset []
    restart: "no"
